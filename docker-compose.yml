version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: caribe_restaurant_app
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
      - /var/www/html/node_modules
    env_file:
      - .env
    depends_on:
      - db
      - redis
    networks:
      - caribe_network

  db:
    image: mysql:8.0
    container_name: servicios_cariberestaurant_db
    restart: always
    environment:
      MYSQL_DATABASE: cariberestaurant
      MYSQL_USER: admin
      MYSQL_PASSWORD: hk4ZIjzAwRGeVTe
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "33060:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - caribe_network

  redis:
    image: redis:alpine
    container_name: servicios_cariberesturant_cache
    restart: always
    command: redis-server --requirepass bulkano26
    ports:
      - "63790:6379"
    volumes:
      - redis_data:/data
    networks:
      - caribe_network

networks:
  caribe_network:
    driver: bridge

volumes:
  db_data:
  redis_data:
